<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f5d6d"/>
      <stop offset="50%" style="stop-color:#1a9fb5"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f5d6d;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#0f5d6d;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#1a9fb5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#2dd4bf;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#1a9fb5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f5d6d;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="320" fill="#0a1628"/>
  
  <!-- Subtle grid -->
  <g opacity="0.05">
    <line x1="0" y1="80" x2="1280" y2="80" stroke="white" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="white" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="white" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="320" stroke="white" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="320" stroke="white" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="320" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Data flow lines -->
  <path d="M0 160 Q320 80 640 160 Q960 240 1280 160" stroke="url(#fadeRight)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M0 180 Q320 100 640 180 Q960 260 1280 180" stroke="url(#fadeRight)" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M0 140 Q320 60 640 140 Q960 220 1280 140" stroke="url(#fadeRight)" stroke-width="1.5" fill="none" opacity="0.2"/>
  <path d="M0 200 Q320 120 640 200 Q960 280 1280 200" stroke="url(#fadeLeft)" stroke-width="1" fill="none" opacity="0.15"/>
  
  <!-- Hexagon nodes (left) -->
  <g opacity="0.15">
    <polygon points="150,120 180,102.5 210,120 210,155 180,172.5 150,155" stroke="white" stroke-width="1" fill="none"/>
    <polygon points="250,80 280,62.5 310,80 310,115 280,132.5 250,115" stroke="white" stroke-width="1" fill="none"/>
    <polygon points="100,200 130,182.5 160,200 160,235 130,252.5 100,235" stroke="white" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Hexagon nodes (right) -->
  <g opacity="0.15">
    <polygon points="950,120 980,102.5 1010,120 1010,155 980,172.5 950,155" stroke="white" stroke-width="1" fill="none"/>
    <polygon points="1050,80 1080,62.5 1110,80 1110,115 1080,132.5 1050,115" stroke="white" stroke-width="1" fill="none"/>
    <polygon points="1000,200 1030,182.5 1060,200 1060,235 1030,252.5 1000,235" stroke="white" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Connection dots -->
  <circle cx="150" cy="120" r="4" fill="white" opacity="0.3"/>
  <circle cx="310" cy="80" r="4" fill="white" opacity="0.3"/>
  <circle cx="160" cy="200" r="4" fill="white" opacity="0.3"/>
  <circle cx="950" cy="120" r="4" fill="white" opacity="0.3"/>
  <circle cx="1110" cy="80" r="4" fill="white" opacity="0.3"/>
  <circle cx="1060" cy="200" r="4" fill="white" opacity="0.3"/>
  
  <!-- Main content area -->
  <rect x="380" y="80" width="520" height="160" rx="12" fill="white" opacity="0.05"/>
  
  <!-- Name -->
  <text x="640" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">Sudeep Pandey</text>
  
  <!-- Divider -->
  <rect x="540" y="155" width="200" height="2" fill="url(#grad)" rx="1"/>
  
  <!-- Title -->
  <text x="640" y="190" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="white" opacity="0.8" letter-spacing="6">SENIOR DATA & AI ENGINEER</text>
  
  <!-- Tech badges -->
  <g transform="translate(420, 210)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="url(#grad)" opacity="0.8"/>
    <text x="45" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="white" letter-spacing="1">AZURE</text>
    
    <rect x="100" y="0" width="110" height="28" rx="14" fill="url(#grad)" opacity="0.8"/>
    <text x="155" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="white" letter-spacing="1">DATABRICKS</text>
    
    <rect x="220" y="0" width="90" height="28" rx="14" fill="url(#grad)" opacity="0.8"/>
    <text x="265" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="white" letter-spacing="1">PYSPARK</text>
    
    <rect x="320" y="0" width="70" height="28" rx="14" fill="url(#grad)" opacity="0.8"/>
    <text x="355" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="white" letter-spacing="1">SQL</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="0" y="316" width="1280" height="4" fill="url(#grad)"/>
</svg>
